<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMP Negeri 156 Jakarta - Portal Resmi</title>
    <!-- Google Fonts & Bootstrap 5 & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .hero { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); color: white; padding: 80px 0; border-radius: 0 0 30px 30px; }
        .card-custom { border: none; border-radius: 16px; background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.05); transition: 0.3s; }
        .card-custom:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .navbar { background: rgba(255,255,255,0.95) !important; backdrop-filter: blur(10px); }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="index.html"><i class="bi bi-building me-2"></i>SMPN 156 JAKARTA</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto gap-2">
        <li class="nav-item"><a class="nav-link active fw-semibold" href="index.html">Beranda</a></li>
        <li class="nav-item"><a class="nav-link fw-semibold" href="kjp.html">KJP & PIP</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Hero Section -->
<div class="hero text-center">
    <div class="container">
        <span class="badge bg-white text-primary px-3 py-2 rounded-pill fw-bold mb-3">Official Website Sekolah</span>
        <h1 class="display-4 fw-bold mb-3">SMP Negeri 156 Jakarta</h1>
        <p class="lead opacity-75">Pusat informasi akademik, berita kegiatan sekolah, transparansi KJP, dan galeri prestasi siswa.</p>
    </div>
</div>

<!-- Container Konten Utama -->
<div class="container my-5">
    <h3 class="fw-bold mb-4"><i class="bi bi-newspaper text-primary me-2"></i> Berita & Pengumuman Terbaru</h3>
    <div id="konten-berita" class="row g-4">
        <!-- Data dimuat secara dinamis via Javascript -->
        <div class="col-12 text-center py-4">
            <p class="text-muted">Memuat informasi berita...</p>
        </div>
    </div>
</div>

<!-- Script untuk Memuat Data Dummy / LocalStorage -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        // Simulasi data berita bawaan atau diambil dari memori lokal
        let beritaDefault = [
            { judul: "Penerimaan Peserta Didik Baru (PPDB) Tahun Ajaran", tipe: "pengumuman", konten: "Informasi lengkap mengenai jadwal dan persyaratan pendaftaran siswa baru SMPN 156 Jakarta.", tanggal: "2026-06-01" },
            { judul: "Kegiatan Jumat Bersih dan Sehat", tipe: "berita", konten: "Seluruh warga sekolah bersama-sama melaksanakan kerja bakti membersihkan lingkungan sekolah.", tanggal: "2026-06-05" }
        ];

        let container = document.getElementById('konten-berita');
        container.innerHTML = '';

        beritaDefault.forEach(i => {
            container.innerHTML += `
                <div class="col-md-6 col-lg-4">
                    <div class="card card-custom h-100 p-4">
                        <span class="badge bg-${i.tipe === 'pengumuman' ? 'warning text-dark' : 'primary'} mb-2 w-25 text-center">${i.tipe}</span>
                        <h5 class="fw-bold mt-2">${i.judul}</h5>
                        <p class="text-secondary small">${i.konten}</p>
                        <small class="text-muted mt-auto"><i class="bi bi-clock me-1"></i> ${i.tanggal}</small>
                    </div>
                </div>`;
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
